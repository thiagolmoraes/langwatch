services:
  # app — upstream v3.28.0 merged the api and worker into one process,
  # run from /app/apps/backend (ADR-168). START_WORKERS=true selects that
  # combined entrypoint in the image's start.sh; there is no worker-only
  # mode, so the separate `workers` service from the old fork is gone.
  app:
    restart: unless-stopped
    image: langwatch/langwatch:3.28.0
    pull_policy: always
    environment:
      START_WORKERS: "true"
      SKIP_ENV_VALIDATION: true
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
      CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
      # This compose stack runs a plain ClickHouse with no backups, so
      # system.backup_log does not exist here. Backup-status collection is on by
      # default (an unset flag must not disarm the alerts that read those gauges
      # in deployments that do have backups), so opt out explicitly rather than
      # failing the query on every stats tick.
      CLICKHOUSE_BACKUP_METRICS_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      LANGWATCH_NLP_SERVICE: http://langwatch_nlp:5561
      LANGEVALS_ENDPOINT: http://langevals:5562
      LANGWATCH_ENDPOINT: http://app:5560
      INSTALL_METHOD: docker
      NODE_ENV: production
      # No S3_BUCKET_NAME configured (self-hosted, no object storage
      # provider) — app falls back to local filesystem for dataset
      # chunks/uploads (src/server/stored-objects/project-storage-destination.ts).
      # Path must be a persistent volume, else a restart loses data the
      # DB still points to.
      LANGWATCH_LOCAL_STORAGE_PATH: /var/lib/langwatch/objects
      # Ops pages (/ops, including /ops/feature-flags where Langy's
      # release_langy_enabled flag lives) are gated on this list.
      ADMIN_EMAILS: thiago.lmoraes@telefonica.com,pietro.farina@telefonica.com,bernardo.soliveira@telefonica.com,ruan.moreira@telefonica.com
      # Turns on the Langy backend; the agent is a plain Go service
      # (langyagent container below), not Kubernetes-specific despite
      # the upstream docs only showing a Helm deployment for it. Port
      # 8080 confirmed from the binary's own startup log, not guessed
      # from the chart's Service port (which fronts a different port).
      LANGY_AGENT_URL: http://langyagent:8080
    env_file:
      - platform/app/.env
      # Isolated on purpose: langyagent spawns LLM-driven shell workers
      # and this compose has no NetworkPolicy like the Helm chart does,
      # so this file carries only LANGY_INTERNAL_SECRET — never the
      # app's DB/Redis/ClickHouse credentials from platform/app/.env.
      - platform/langy.env
    ports:
      - "5560:5560"
    volumes:
      - langwatch-objects:/var/lib/langwatch/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # langyagent — Langy, the in-product AI assistant. Upstream only
  # documents a Helm/Kubernetes deployment (separate pod, gVisor sandbox
  # option, NetworkPolicy), but the image itself is a plain Go binary
  # with no Kubernetes dependency; it runs fine as a normal container
  # here. No sandboxing or GitHub App configured yet — Langy can answer
  # questions about traces, but can't open pull requests until
  # GITHUB_LANGY_* is set on `app`.
  langyagent:
    image: langwatch/langyagent:3.28.0
    pull_policy: always
    restart: always
    env_file:
      - platform/langy.env
    environment:
      ENVIRONMENT: production

  # nlpgo — the Go NLP engine. langwatch/langwatch_nlp is now a static Go
  # binary (Dockerfile.langwatch_nlp); it still binds :5561 and reads
  # LANGWATCH_ENDPOINT for evaluator + agent-workflow callbacks.
  langwatch_nlp:
    image: langwatch/langwatch_nlp:latest
    env_file:
      - platform/app/.env
    ports:
      - "127.0.0.1:5561:5561"
    restart: always
    pull_policy: always
    environment:
      - LANGWATCH_ENDPOINT=http://app:5560

  langevals:
    image: langwatch/langevals:latest
    ports:
      - "127.0.0.1:5562:5562"
    restart: always
    pull_policy: always
    environment:
      - DISABLE_EVALUATORS_PRELOAD=true

  # gateway — the AI Gateway (Go binary, services/aigateway), official image.
  # ENVIRONMENT=local matches how real production runs today: the
  # ModelProvider points at llama-swap over plain HTTP, so the hosted-only
  # SSRF checks (BLOCK_LOCAL_HTTP_CALLS, REQUIRE_HTTPS_CUSTOM_ENDPOINTS)
  # must stay off. Those two flags only matter when ENVIRONMENT != local
  # (see services/aigateway/config.go validateHostedEgressSecurity), so
  # they're dropped here instead of left as dead/confusing "true" values.
  gateway:
    image: langwatch/ai-gateway:3.28.0
    pull_policy: always
    ports:
      - "5563:5563"
    environment:
      ENVIRONMENT: local
      LW_GATEWAY_BASE_URL: http://app:5560
      SERVER_ADDR: ":5563"
    env_file:
      - platform/app/.env
    depends_on:
      - app
    restart: always

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    environment:
      CLICKHOUSE_PASSWORD: langwatch
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

volumes:
  db-data:
  redis-data:
  clickhouse-data:
  langwatch-objects:
